name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build and test
        run: dotnet test PieceOfCake.sln -c Release
      - name: Publish
        run: dotnet publish src/PieceOfCake/PieceOfCake.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o publish
      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath PieceOfCake-win-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: PieceOfCake-win-x64
          path: PieceOfCake-win-x64.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            PieceOfCake-win-x64.zip
            publish/PieceOfCake.exe
